<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Tour Du Lịch - Vietjet Travel</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/jpeg" href="image/logo.jpg">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <img src="image/logo.jpg" alt="Vietjet Logo">
        <div>
          <span class="brand-tagline">VIETJET TRAVEL</span>
        </div>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Trang Chủ</a>
        <a href="flights.html" class="nav-link">Chuyến Bay</a>
        <a href="tours.html" class="nav-link active">Tour Du Lịch</a>
      </nav>

      <div class="header-actions">
        <a href="tel:19001886" class="hotline-pill">
          <span class="hotline-icon">📞</span> 1900 1886
        </a>
        <a href="cart.html" class="cart-btn">
          <span>🛒</span>
          <span>Giỏ Hàng</span>
          <span class="cart-badge">0</span>
        </a>
        <button class="mobile-toggle" aria-label="Toggle Menu">☰</button>
      </div>
    </div>
  </header>

  <!-- ================= BREADCRUMB ================= -->
  <div style="background: var(--bg-white); border-bottom: 1px solid var(--border-light); padding: 16px 0;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <a href="tours.html" style="color:var(--primary-red); font-weight:700; font-size:0.9rem;">
        ← Quay lại danh sách tour
      </a>
      <div style="font-size:0.85rem; color:var(--text-muted);" id="tourBreadcrumb">
        Chi tiết lịch trình tour
      </div>
    </div>
  </div>

  <!-- ================= MAIN CONTAINER ================= -->
  <main class="container" style="padding: 40px 20px 60px;">
    <div id="tourDetailContainer">
      <!-- Render bằng tour-detail.js -->
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 Vietjet Travel Portal. Chạy trên công nghệ SQLite Client-side & Vanilla JS.</div>
        <div>Màu nhận diện: <strong style="color:var(--primary-red);">#EE1D23</strong> (Vietjet Red)</div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script src="js/tour-detail.js"></script>
</body>
</html>
